[project]
name = "pushtotalk"
version = "0.1.0"
description = "Push-to-talk dictation: hold F8, get Whisper transcript at the caret"
requires-python = ">=3.13,<3.14"
dependencies = [
    "dearpygui>=2.3.1",
    "faster-whisper>=1.1",
    "nvidia-cublas-cu12>=12.8",
    "nvidia-cudnn-cu12>=9.7",
    "sounddevice>=0.5.5",
    "winrt-windows-foundation>=3.2.1",
    "winrt-windows-foundation-collections>=3.2.1",
    "winrt-windows-media-control>=3.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pushtotalk"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: takes focus and injects real keystrokes; deselect with -m 'not integration'",
]
